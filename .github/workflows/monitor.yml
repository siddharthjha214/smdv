name: YouTube Tracker

on:
  workflow_dispatch:

concurrency:
  group: youtube-tracker-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cloudflare WARP (Residential IP Cloaking)
        run: |
          echo "Installing Cloudflare WARP headless daemon..."
          # Clean up any bad configurations and fix slow Azure mirrors
          sudo rm -f /etc/apt/apt.conf.d/80-custom-timeouts /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google* 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          # Install only the tiny TPM libraries warp-svc needs (~30 KB total, takes 0.5s)
          sudo apt-get install -y --no-install-recommends libtss2-tctildr0t64 libtss2-esys-3.0.2-0t64 2>/dev/null || true

          # Download official Cloudflare WARP package directly from Cloudflare edge CDN (fast 1-2s download)
          WARP_DEB_PATH=$(curl -fsSL https://pkg.cloudflareclient.com/dists/noble/main/binary-amd64/Packages | grep -m1 '^Filename: ' | cut -d' ' -f2)
          curl -fsSL -o /tmp/warp.deb "https://pkg.cloudflareclient.com/${WARP_DEB_PATH}"

          # Extract only warp-svc & warp-cli (completely skips 116 MB of WebKitGTK, GStreamer, and 60 desktop GUI packages)
          mkdir -p /tmp/warp_pkg
          dpkg-deb -x /tmp/warp.deb /tmp/warp_pkg
          sudo cp -f /tmp/warp_pkg/bin/warp-svc /usr/bin/warp-svc
          sudo cp -f /tmp/warp_pkg/bin/warp-cli /usr/bin/warp-cli
          sudo ln -sf /usr/bin/warp-svc /bin/warp-svc
          sudo ln -sf /usr/bin/warp-cli /bin/warp-cli
          sudo cp -f /tmp/warp_pkg/lib/systemd/system/warp-svc.service /lib/systemd/system/warp-svc.service
          sudo chmod +x /usr/bin/warp-svc /usr/bin/warp-cli
          rm -rf /tmp/warp.deb /tmp/warp_pkg

          # Grant network capabilities and start daemon
          sudo setcap cap_setuid,cap_setgid,cap_net_raw,cap_dac_read_search,cap_net_admin,cap_net_bind_service,cap_sys_ptrace+ei /usr/bin/warp-svc
          sudo systemctl daemon-reload
          sudo systemctl enable --now warp-svc.service
          sleep 2

          # Register and connect WARP
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect || true
          sleep 3

          echo "WARP Status:"
          warp-cli --accept-tos status || true
          echo "Outbound IP check:"
          curl -sS https://cloudflare.com/cdn-cgi/trace | grep -E "ip=|loc=|warp=" || curl -sS https://ifconfig.me || echo "(IP check done)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python3 -m pip install -U \
            https://github.com/yt-dlp/yt-dlp/archive/master.zip \
            requests pytz google-api-python-client google-auth-httplib2 google-auth-oauthlib \
            curl-cffi bgutil-ytdlp-pot-provider pytubefix nodejs-wheel-binaries certifi pillow

      - name: Verify Environment & PO Token Provider
        run: |
          echo "=== Environment Check ==="
          echo "Python: $(python3 --version)"
          echo "ffmpeg: $(ffmpeg -version 2>&1 | head -1)"
          echo "Deno:   $(deno --version 2>&1 | head -1 || echo 'not found in PATH')"
          echo "yt-dlp: $(python3 -m yt_dlp --version)"
          echo "========================="

          echo "Checking PO Token Provider service (http://127.0.0.1:4416)..."
          READY=false
          for i in {1..25}; do
            if curl -sS -m 2 http://127.0.0.1:4416/ping > /dev/null 2>&1; then
              echo "✅ PO Token Provider server is active and responding on port 4416!"
              READY=true
              break
            fi
            echo "Waiting for PO Token Provider server to be ready ($i/25)..."
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "⚠️ Service container did not respond in time. Starting Docker container directly as fallback..."
            docker run -d --name bgutil-direct -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider:latest || true
            sleep 3
            if curl -sS -m 2 http://127.0.0.1:4416/ping > /dev/null 2>&1; then
              echo "✅ Fallback Docker container started and responding on port 4416!"
            else
              echo "⚠️ Could not verify PO Token Provider HTTP server."
            fi
          fi

          echo "Installed yt-dlp plugins:"
          python3 -c "import yt_dlp; ydl = yt_dlp.YoutubeDL({'quiet': True}); print([p.ie_key() for p in ydl._ies if 'pot' in p.ie_key().lower()])" 2>/dev/null || echo "(plugin check completed)"

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python3 -c '
          import os, base64

          raw = os.environ.get("YOUTUBE_COOKIES", "").strip()
          if raw:
              content = raw
              # Check if raw is already plain Netscape cookie text
              if raw.startswith("#") or "\t.youtube.com\t" in raw or "\tyoutube.com\t" in raw:
                  content = raw
              else:
                  try:
                      decoded = base64.b64decode(raw).decode("utf-8", errors="replace")
                      if decoded.startswith("#") or "\t" in decoded:
                          content = decoded
                  except Exception:
                      content = raw

              # Ensure Netscape header exists
              if not content.startswith("# Netscape") and not content.startswith("# HTTP"):
                  content = "# Netscape HTTP Cookie File\n" + content.lstrip()

              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write(content)
              
              size = len(content.encode("utf-8"))
              lines = len(content.splitlines())
              print(f"Optional cookies.txt loaded: {size} bytes, {lines} lines")
          else:
              print("No YOUTUBE_COOKIES secret found — operating in 100% Cookieless PO-Token + WARP Autopilot Mode!")
          '
          python3 main.py