name: YouTube Tracker

on:
  workflow_dispatch:

  schedule:
    # Fallback safety net — GitHub throttles this heavily on free tier
    # Real scheduling is handled by the self-chaining job below
    - cron: "0 */2 * * *"

concurrency:
  group: youtube-tracker-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            echo "ffmpeg is already installed on the runner"
          fi

      - name: Install Python Dependencies
        run: |
          pip install -U "yt-dlp[default]" requests pytz google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi
          python main.py

  # Self-chaining job: waits 30 minutes then re-triggers this workflow.
  # This bypasses GitHub's unreliable free-tier cron scheduler.
  reschedule:
    runs-on: ubuntu-latest
    needs: run-bot
    if: always()

    steps:
      - name: Wait 30 minutes
        run: sleep 1800

      - name: Re-trigger workflow
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches \
            -d '{"ref":"main"}'