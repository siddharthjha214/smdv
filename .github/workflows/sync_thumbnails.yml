name: Sync Missing Thumbnails

on:
  workflow_dispatch:

concurrency:
  group: youtube-thumbnail-sync
  cancel-in-progress: false

jobs:
  sync-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install -U requests google-api-python-client google-auth-httplib2 google-auth-oauthlib pillow

      - name: Run Thumbnail Sync
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: |
          python3 sync_thumbnails.py
